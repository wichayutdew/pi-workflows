name: Release merged pull request

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.event.pull_request.merged == true && github.event.pull_request.base.ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Determine semantic version bump
        id: release_bump
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bun .github/scripts/release-bump.mjs

      - name: Install dependencies
        if: steps.release_bump.outputs.bump != ''
        run: bun ci

      - name: Verify merged source
        if: steps.release_bump.outputs.bump != ''
        run: bun run check

      - name: Bump package version
        if: steps.release_bump.outputs.bump != ''
        id: version
        env:
          BUMP: ${{ steps.release_bump.outputs.bump }}
        run: |
          bun pm version "$BUMP" --no-git-tag-version
          echo "version=$(bun --eval \"console.log(require('./package.json').version)\")" >> "$GITHUB_OUTPUT"

      - name: Pack plugin artifact
        if: steps.release_bump.outputs.bump != ''
        run: bun pm pack --destination release-artifact

      - name: Commit and tag release
        if: steps.release_bump.outputs.bump != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json bun.lock
          git commit -m "chore(release): v$VERSION [skip ci]"
          git tag "v$VERSION"
          git push origin HEAD:${{ github.event.repository.default_branch }} --follow-tags

      - name: Create GitHub Release
        if: steps.release_bump.outputs.bump != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: release-artifact/*.tgz
