version: 1
id: jira
command: jira
description: 'Draft, approve, and create a Jira Epic with ordered Stories. Example: /jira ACTB Implement multi-region failover for pricing service'
start: draft
maxStepVisits: 12
summaryMaxChars: 30000
steps:
  draft:
    title: Normalize Epic and Story input
    prompt:
      file: steps/jira/draft.md
    agent: scout
    permissions:
      tools: [read, ls, bash]
      mcp: []
      extensions: [/]
      skills: [jira-ticket, caveman]
      bash:
        mode: unrestricted
    transitions:
      ready: plan
      retry: draft
      blocked: $pause
  plan:
    title: Validate Jira schema and approve Epic and Story plan
    prompt:
      file: steps/jira/plan.md
    agent: planner
    permissions:
      tools: [read, ls, bash, mcp]
      mcp: [atlassian]
      extensions: [/]
      skills: [jira-ticket, caveman]
      bash:
        mode: unrestricted
    gate:
      provider: plannotator
      submitOutcome: submit
      approvedOutcome: approved
      rejectedOutcome: changes-requested
      timeoutMs: 30000
      artifactContract:
        maxChars: 16000
        requiredSubstrings:
          - '# Create Jira Epic and Stories'
          - '## Jira field contract'
          - '## Epic'
          - '## Ordered Stories'
          - '## Creation sequence'
          - '## Safety limits'
        forbiddenSubstrings:
          - 'The complete gate artifact is the exact Markdown saved at'
        onValidationFailure: retry
    transitions:
      approved: create
      changes-requested: plan
      retry: plan
      blocked: $pause
  create:
    title: Create approved Jira Epic and Stories
    prompt:
      file: steps/jira/create.md
    agent: worker
    permissions:
      tools: [read, ls, bash, mcp]
      mcp: [atlassian]
      extensions: [/]
      skills: [jira-ticket, caveman]
      bash:
        mode: unrestricted
    transitions:
      ready: $done
      retry: create
      blocked: $pause
