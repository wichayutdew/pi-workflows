version: 1
id: work
command: work
description: 'Jira or brief → plan → worktree → TDD → review → PR/MR.'
start: intake
maxStepVisits: 10
summaryMaxChars: 30000
steps:
  intake:
    title: Pull Jira or normalize the brief
    prompt: { file: steps/work/intake.md }
    agent: scout
    maxToolCalls: 10
    permissions:
      tools: [read, ls, bash, mcp]
      mcp: []
      extensions: []
      skills: []
      bash: { mode: unrestricted }
    transitions:
      { ready: plan, retry: intake, blocked: $pause, handoff: intake }
  plan:
    title: Plan work for Plannotator
    prompt: { file: steps/work/plan.md }
    agent: planner
    maxToolCalls: 60
    permissions:
      tools: [read, ls, bash, mcp]
      mcp: []
      extensions: []
      skills: []
      bash: { mode: unrestricted }
    gate:
      provider: plannotator
      submitOutcome: submit
      approvedOutcome: approved
      rejectedOutcome: changes-requested
      timeoutMs: 30000
      artifactContract:
        maxChars: 10000
        requiredSubstrings:
          - '## Goal/Acceptance Criteria'
          - '## Non Goal'
          - '## Implementation Steps and Tests'
          - '## Validation'
          - '## Risks/Decisions Needed'
          - '## Publications Contract/Metadata'
          - '## Execution appendix (machine-readable)'
        forbiddenSubstrings:
          - 'The complete gate artifact is the exact Markdown saved at'
        onValidationFailure: retry
    transitions:
      {
        approved: prepare-workspace,
        changes-requested: plan,
        retry: plan,
        blocked: $pause,
        handoff: plan,
      }
  prepare-workspace:
    title: Create worktree and branch
    prompt: { file: steps/work/prepare-workspace.md }
    agent: scout
    maxToolCalls: 10
    workspace:
      bindOn: [ready]
      allowedRoots: [~/repositories/worktrees]
    permissions:
      tools: [read, ls, bash]
      mcp: []
      extensions: []
      skills: []
      bash: { mode: unrestricted }
    transitions:
      {
        ready: implement,
        workspace-refresh: plan,
        retry: prepare-workspace,
        blocked: $pause,
        handoff: prepare-workspace,
      }
  implement:
    title: Implement approved plan with TDD
    prompt: { file: steps/work/implement.md }
    agent: worker
    maxToolCalls: 60
    permissions:
      tools: [read, ls, bash, edit, write, mcp]
      mcp: []
      extensions: []
      skills: []
      bash: { mode: unrestricted }
    transitions:
      {
        checkpoint: implement,
        ready: verify,
        retry: implement,
        blocked: $pause,
        handoff: implement,
      }
  verify:
    title: Check goal and acceptance criteria
    prompt: { file: steps/work/verify.md }
    agent: reviewer
    maxToolCalls: 60
    permissions:
      tools: [read, ls, bash]
      mcp: []
      extensions: []
      skills: []
      bash: { mode: unrestricted }
    transitions:
      {
        passed: publish,
        failed: implement,
        retry: verify,
        blocked: verify,
        handoff: verify,
      }
  publish:
    title: Push and open or update PR/MR
    prompt: { file: steps/work/publish-remote.md }
    agent: scout
    maxToolCalls: 10
    permissions:
      tools: [read, ls, bash, mcp]
      mcp: []
      extensions: []
      skills: []
      bash: { mode: unrestricted }
    transitions:
      { published: $done, retry: publish, blocked: $pause, handoff: publish }
