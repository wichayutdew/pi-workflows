version: 1
id: work
command: work
description: Prepare a dedicated workspace, plan, implement, and verify local work
start: prepare-workspace
maxStepVisits: 20
summaryMaxChars: 30000
steps:
  prepare-workspace:
    title: Prepare dedicated branch and worktree
    prompt:
      file: steps/shared/prepare-workspace.md
    agent: worker
    workspace:
      bindOn: [ready]
      allowedRoots: ['~/repositories/worktrees']
    permissions:
      tools: [read, ls, bash]
      skills: [caveman, coding-standards, using-git-worktrees]
      bash:
        mode: unrestricted
    requires:
      tools: [read, ls, bash]
      skills: [caveman, coding-standards, using-git-worktrees]
    transitions:
      ready: plan
      retry: prepare-workspace
      blocked: $pause
  plan:
    title: Explore and plan local work
    prompt:
      file: steps/work/plan.md
    agent: planner
    permissions:
      tools: [read, ls, bash]
      mcp: &work-mcp
        - context7/resolve-library-id
        - context7/query-docs
        - sourcegraph/code_finder
        - sourcegraph/commit_search
        - sourcegraph/diff_search
        - sourcegraph/keyword_search
        - sourcegraph/list_files
        - sourcegraph/list_repos
        - sourcegraph/nls_search
        - sourcegraph/read_file
        - gh_grep/searchGitHub
      extensions: [pi-web-tools]
      skills: &work-plan-skills [caveman, brainstorming, coding-standards]
      bash:
        mode: allow-list
        allow: &work-inspection-bash
          - executable: grep
          - executable: head
          - executable: ls
          - executable: pwd
          - executable: rg
          - executable: stat
          - executable: tail
          - executable: wc
          - executable: git
            argsPrefixes:
              [
                [status],
                [diff],
                [grep],
                [log],
                [ls-files],
                [rev-parse],
                [show],
                [merge-base],
                [rev-list],
                [worktree, list],
              ]
    requires:
      tools: [read, ls, bash]
      skills: *work-plan-skills
    gate:
      provider: plannotator
      submitOutcome: submit
      approvedOutcome: approved
      rejectedOutcome: changes-requested
      timeoutMs: 30000
    transitions:
      approved: implement
      changes-requested: plan
      workspace-refresh: prepare-workspace
      retry: plan
      blocked: $pause
  implement:
    title: Implement the approved local plan
    prompt:
      file: steps/work/implement.md
    agent: worker
    permissions:
      tools: [read, ls, bash, edit, write]
      mcp: *work-mcp
      skills:
        &work-implement-skills [
          caveman,
          coding-standards,
          systematic-debugging,
          test-driven-development,
          verification-before-completion,
          receiving-code-review,
        ]
      bash:
        mode: unrestricted
    requires:
      tools: [read, ls, bash, edit, write]
      skills: *work-implement-skills
    transitions:
      ready: verify
      retry: implement
      blocked: $pause
  verify:
    title: Independently verify local work
    prompt:
      file: steps/work/verify.md
    agent: reviewer
    permissions:
      tools: [read, ls, bash]
      mcp: *work-mcp
      skills:
        &work-verify-skills [
          caveman,
          coding-standards,
          verification-before-completion,
        ]
      bash:
        mode: unrestricted
    requires:
      tools: [read, ls, bash]
      skills: *work-verify-skills
    transitions:
      passed: $done
      failed: implement
      retry: verify
      blocked: verify
