# yaml-language-server: $schema=../schemas/settings.schema.json
version: 1
allowProjectWorkflows: false
statusShortcut: ctrl+alt+w
permissionCeiling:
  tools: [read, grep, bash]
  mcp: []
  extensions: []
  skills: []
  bash:
    mode: allow-list
    allow:
      - executable: git
        argsPrefixes:
          [[status], [diff], [log], [show], [grep], [ls-files], [rev-parse]]
      - executable: rg
        argsPrefix: []
  subagent:
    agents: [scout, planner, worker, reviewer]
    contexts: [fresh]
    models: []
    maxTimeoutMs: 900000
    maxTurns: 40
    maxGraceTurns: 3
    maxToolCalls: 100
    artifacts: false
    retryToolFailures: false
