# yaml-language-server: $schema=../schemas/workflow.schema.json
version: 1
id: mr-comments
command: mr-comments
description: Inspect merge-request feedback, plan changes, implement, and verify
start: inspect
maxStepVisits: 5
summaryMaxChars: 4000
steps:
  inspect:
    title: Inspect merge request
    prompt:
      file: prompts/mr-comments/inspect.md
    subagent:
      agent: pi-workflows.step
      context: fresh
      timeoutMs: 600000
      turnBudget:
        maxTurns: 12
        graceTurns: 2
    permissions:
      tools: [read, grep, bash]
      mcp: [gitlab/get_merge_request, gitlab/list_merge_request_discussions]
      bash:
        mode: read-only
    requires:
      tools: [read, bash, mcp]
    transitions:
      ready: plan
      blocked: $pause
  plan:
    title: Plan the change
    prompt:
      file: prompts/mr-comments/plan.md
    subagent:
      agent: pi-workflows.step
      context: fresh
      timeoutMs: 600000
      turnBudget:
        maxTurns: 16
        graceTurns: 2
    permissions:
      tools: [read, grep, bash]
      mcp: [gitlab/get_merge_request, gitlab/list_merge_request_discussions]
      extensions: [plannotator]
      skills: [superpowers:brainstorming]
      bash:
        mode: read-only
    requires:
      tools: [read, mcp]
      extensions: [plannotator]
      skills: [superpowers:brainstorming]
    gate:
      provider: plannotator
      submitOutcome: submit
      approvedOutcome: approved
      rejectedOutcome: changes-requested
      timeoutMs: 5000
    transitions:
      approved: implement
      changes-requested: plan
      blocked: $pause
  implement:
    title: Implement the approved plan
    prompt:
      file: prompts/mr-comments/implement.md
    subagent:
      agent: pi-workflows.step
      context: fresh
      timeoutMs: 1200000
      artifacts: true
    permissions:
      tools: [read, grep, edit, write, bash]
      skills: [superpowers:test-driven-development]
      bash:
        mode: allow-list
        allow:
          - executable: git
            argsPrefixes: [[status], [diff]]
          - executable: npm
            argsPrefix: [test]
        approvedSources: [verification-worker]
    requires:
      tools: [read, edit, bash]
      skills: [superpowers:test-driven-development]
    transitions:
      ready: verify
      blocked: $pause
  verify:
    title: Verify the result
    prompt:
      file: prompts/mr-comments/verify.md
    subagent:
      agent: pi-workflows.step
      context: fresh
      timeoutMs: 600000
      turnBudget:
        maxTurns: 16
        graceTurns: 2
    permissions:
      tools: [read, grep, bash]
      bash:
        mode: allow-list
        allow:
          - executable: git
            argsPrefixes: [[status], [diff]]
          - executable: npm
            argsPrefix: [test]
        approvedSources: [verification-reviewer]
    requires:
      tools: [read, bash]
    transitions:
      passed: $done
      failed: implement
      blocked: $pause
